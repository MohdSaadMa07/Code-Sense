services:
  - type: web
    name: codesense-api
    env: python
    buildCommand: |
      pip install -r code-app/requirements.txt
      cd code-app && python download_onnx_model.py
    startCommand: cd code-app && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
